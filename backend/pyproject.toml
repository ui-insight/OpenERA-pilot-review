[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "app"
version = "0.1.0"
description = "OpenERA Pilot Review — FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.135.3",
    "uvicorn[standard]>=0.44.0",
    "sqlalchemy[asyncio]>=2.0.49",
    "pydantic>=2.13.1",
    "pydantic-settings>=2.0.0",
    "pyjwt[crypto]>=2.12.1",
    "bcrypt>=4.0.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.31.0",
    "python-multipart>=0.0.26",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.0.0",
    "httpx>=0.27.0",
    "ruff>=0.15.10",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
